# Supabase local development config.
# Docs: https://supabase.com/docs/guides/cli/config
project_id = "plannit"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# Deep link back into the iOS app after auth.
site_url = "plannit://auth-callback"
additional_redirect_urls = ["plannit://auth-callback"]
jwt_expiry = 3600
enable_signup = true

# Beta: no email confirmation. The confirmation link points at `site_url`, which
# is a deep link into the app rather than a web page — so a new account can't
# actually be confirmed, and sign-up would dead-end.
#
# NOTE: this governs `supabase start` locally. The hosted project reads its auth
# settings from the dashboard, so it has to be turned off there too:
# Authentication → Sign In / Providers → Email → Confirm email.
#
# Do NOT use `supabase config push` to sync it: that pushes this whole file,
# including [auth.external.apple], whose client_id/secret come from env vars
# that aren't set on this machine — it would reconfigure the live Apple
# provider as a side effect of a one-line change.
#
# Turn confirmations back on before anyone who isn't a tester can sign up.
[auth.email]
enable_confirmations = false

# Sign in with Apple — the primary auth method for Plannit (see docs/decisions.md D-03).
# Secrets are provided via env, never committed.
[auth.external.apple]
enabled = true
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_SECRET)"

[functions.find-slots]
verify_jwt = true

# Internal-only: protected by INTERNAL_FUNCTION_SECRET, not a user JWT.
[functions.send-push]
verify_jwt = false

# A landing page for a texted link: the reader has no account yet, by
# definition. The 244-bit token in the query string is the only credential, and
# peek_invite() is written to return nothing useful without a valid one.
[functions.invite]
verify_jwt = false
