# Supabase local development config.
# Docs: https://supabase.com/docs/guides/cli/config
project_id = "plannit"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# Deep link back into the iOS app after auth.
site_url = "plannit://auth-callback"
additional_redirect_urls = ["plannit://auth-callback"]
jwt_expiry = 3600
enable_signup = true

# Email accounts confirm with a 6-digit code typed into the app, not a link:
# `site_url` is a deep link with no web page behind it, so an emailed link would
# dead-end. The templates below print `{{ .Token }}` instead of a URL. Signing in
# after confirmation needs only the password; a reset uses a code the same way.
#
# NOTE: this governs `supabase start` locally. The hosted project reads its auth
# settings, templates and SMTP from the dashboard — see
# docs/backend/auth-setup.md for the order to change them in. Confirmation only
# works on the hosted project once custom SMTP is set up: the built-in sender
# delivers only to the project's own team members.
#
# Do NOT use `supabase config push` to sync any of this: it pushes this whole
# file, including provider client_id/secret values that come from env vars not
# set on this machine — it would reconfigure the live providers as a side effect.
[auth.email]
enable_confirmations = true
otp_length = 6
otp_expiry = 3600
# The auth server's own floor between two emails to one address.
max_frequency = "60s"

[auth.email.template.confirmation]
subject = "Your Plannit code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Your Plannit password reset code"
content_path = "./supabase/templates/recovery.html"

# Sign in with Apple, native: the app sends Apple's identity token to the
# id_token grant, which checks its audience against client_id — the app's
# bundle id. Secrets are provided via env, never committed.
[auth.external.apple]
enabled = true
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_SECRET)"

# Google, through Supabase's web OAuth page (no Google SDK in the app). The
# client is a Google Cloud "Web application" OAuth client whose authorised
# redirect URI is <project>/auth/v1/callback.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"

[functions.find-slots]
verify_jwt = true

# Internal-only: protected by INTERNAL_FUNCTION_SECRET, not a user JWT.
[functions.send-push]
verify_jwt = false

# A landing page for a texted link: the reader has no account yet, by
# definition. The 244-bit token in the query string is the only credential, and
# peek_invite() is written to return nothing useful without a valid one.
[functions.invite]
verify_jwt = false
