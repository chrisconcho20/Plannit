<!doctype html>
<html lang="en">
<head>
  <!-- Reset password. Source of truth for Authentication → Emails → "Reset password"
       in the Supabase dashboard; subject: "Your Plannit password reset code". The
       app has no web page for a link to open, so this sends the code only. Colours
       and type follow design-system/tokens; layout is table-based and inline-styled for mail clients. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light only">
  <title>Your Plannit password reset code</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin:0; padding:0; background-color:#FFFBF6;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:#FFFBF6;">Your code is {{ .Token }}. Enter it in the app to choose a new password.</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFBF6" style="background-color:#FFFBF6;">
    <tr>
      <td align="center" style="padding:40px 20px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px; font-family:'Figtree',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;">

          <tr>
            <td align="center" style="padding:0 0 24px; font-size:28px; font-weight:800; letter-spacing:-0.03em; color:#F76941;">Plannit</td>
          </tr>

          <tr>
            <td bgcolor="#FFFFFF" style="background-color:#FFFFFF; border:1px solid #EFE9DF; border-radius:18px; padding:36px 28px; box-shadow:0 4px 12px -2px rgba(26,23,20,.10);">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="font-size:28px; line-height:1.2; font-weight:700; letter-spacing:-0.02em; color:#1A1714; padding:0 0 12px;">Reset your password</td>
                </tr>
                <tr>
                  <td style="font-size:17px; line-height:1.5; color:#5A524A; padding:0 0 28px;">Enter this code in the app, then choose a new password.</td>
                </tr>
                <tr>
                  <td align="center" bgcolor="#FFF3EE" style="background-color:#FFF3EE; border:1px solid #FFE2D7; border-radius:14px; padding:22px 12px;">
                    <span style="font-size:36px; line-height:1; font-weight:800; letter-spacing:10px; padding-left:10px; color:#1A1714; font-variant-numeric:tabular-nums; font-family:'Figtree',-apple-system,BlinkMacSystemFont,'SF Pro Rounded','Segoe UI',Roboto,sans-serif;">{{ .Token }}</span>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="font-size:13px; line-height:1.5; color:#7A7268; padding:12px 0 0;">The code works for one hour.</td>
                </tr>

              </table>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:24px 12px 0; font-size:13px; line-height:1.5; color:#9E958A;">If you didn't ask to reset your password, you can ignore this email. Your password hasn't changed.</td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
