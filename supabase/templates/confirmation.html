<!-- Confirm signup. Source of truth for Authentication → Emails → "Confirm signup"
     in the Supabase dashboard; subject: "Your Plannit code". The app has no web
     page for a link to open, so this sends the code only. -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 420px; margin: 0 auto; padding: 24px; color: #1f1a17;">
  <h2 style="margin: 0 0 12px;">Welcome to Plannit</h2>
  <p style="margin: 0 0 20px;">Enter this code in the app to finish creating your account:</p>
  <p style="font-size: 32px; font-weight: 700; letter-spacing: 6px; margin: 0 0 20px;">{{ .Token }}</p>
  <p style="margin: 0; color: #6b625c; font-size: 14px;">If you didn't try to sign up for Plannit, you can ignore this email.</p>
</div>
