<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="Free/busy is the pair that matters most in Plannit" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);font:var(--type-body)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:10}.s{background:var(--bg-surface);border-radius:var(--r-md);padding:12px;box-shadow:var(--shadow-1)}.dot{width:22px;height:22px;border-radius:var(--r-pill);margin-bottom:8px}.k{font:var(--type-caption);color:var(--text-muted)}.v{font:var(--type-subhead);font-weight:600;color:var(--text-strong)}</style></head><body><div class="g"><div class="s"><div class="dot" style="background:#14A98F"></div><div class="v">Everyone free</div><div class="k">--status-free</div></div><div class="s"><div class="dot" style="background:#C2B9AD"></div><div class="v">Busy block</div><div class="k">--status-busy</div></div><div class="s"><div class="dot" style="background:#2FA96B"></div><div class="v">Saved / synced</div><div class="k">--status-success</div></div><div class="s"><div class="dot" style="background:#D98A0B"></div><div class="v">Needs a vote</div><div class="k">--status-warning</div></div><div class="s"><div class="dot" style="background:#DC3B45"></div><div class="v">Leave / delete</div><div class="k">--status-danger</div></div></div></body></html>
