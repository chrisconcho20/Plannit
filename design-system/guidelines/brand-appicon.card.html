<!-- @dsCard group="Brand" viewport="700x300" name="App icon — The found day" subtitle="Chosen direction, exported to assets/app-icon (1024 + every iOS size)" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:18px;background:var(--bg-app)}
.row{display:flex;align-items:flex-end;gap:22px}
.i{display:flex;flex-direction:column;align-items:center;gap:7px}
.i img{border-radius:22.5%;box-shadow:var(--shadow-2);display:block}
.i span{font:var(--fw-semibold) 10px/1 var(--font-mono);color:var(--text-faint)}
.home{margin-left:8px;padding:16px 20px;border-radius:var(--r-xl);background:var(--ink-900);display:flex;gap:18px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px}
.app img{width:56px;border-radius:22.5%;display:block}
.app b{font:var(--fw-medium) 11px/1 var(--font-core);color:#fff}
.ph{width:56px;height:56px;border-radius:22.5%;background:rgba(255,255,255,.12)}
.n{font:var(--type-footnote);color:var(--text-muted);margin-top:14px;text-wrap:pretty}
</style></head><body>
<div class="row">
  <div class="i"><img src="../assets/app-icon/PlannitAppIcon-180.png" width="180" height="180" alt="Plannit app icon at 180px"><span>180px</span></div><div class="i"><img src="../assets/app-icon/PlannitAppIcon-120.png" width="120" height="120" alt="Plannit app icon at 120px"><span>120px</span></div><div class="i"><img src="../assets/app-icon/PlannitAppIcon-87.png" width="87" height="87" alt="Plannit app icon at 87px"><span>87px</span></div><div class="i"><img src="../assets/app-icon/PlannitAppIcon-60.png" width="60" height="60" alt="Plannit app icon at 60px"><span>60px</span></div><div class="i"><img src="../assets/app-icon/PlannitAppIcon-40.png" width="40" height="40" alt="Plannit app icon at 40px"><span>40px</span></div>
  <div class="home">
    <div class="app"><img src="../assets/app-icon/PlannitAppIcon-180.png" alt="Plannit on a home screen"><b>Plannit</b></div>
    <div class="app"><span class="ph"></span></div>
    <div class="app"><span class="ph"></span></div>
  </div>
</div>
<div class="n">Coral ground, warm-white page, one teal cell — the moment a date is found. Square and opaque; iOS applies the squircle mask. Drop <code>assets/app-icon/AppIcon.appiconset</code> straight into <code>Assets.xcassets</code>.</div>
</body></html>
