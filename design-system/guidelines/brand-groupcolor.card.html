<!-- @dsCard group="Brand" viewport="700x160" name="Group colour in use" subtitle="One hue per group, reused across chip, event tile, day dot and avatar ring" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);font:var(--type-body)}.g{display:flex;gap:14;align-items:center;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-pill);background:var(--hue-sky);color:#fff;font:var(--type-subhead);font-weight:600}.tile{width:44px;height:44px;border-radius:var(--r-md);background:var(--hue-sky);display:flex;align-items:center;justify-content:center}.tile span{width:22px;height:22px;background:#fff;-webkit-mask:url(../assets/icons/calendar.svg) center/contain no-repeat;mask:url(../assets/icons/calendar.svg) center/contain no-repeat}.day{width:40px;height:42px;border-radius:var(--r-md);background:var(--bg-surface);box-shadow:var(--shadow-1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:var(--fw-semibold) 15px/1 var(--font-core);color:var(--text-strong)}.dot{width:5px;height:5px;border-radius:99px;background:var(--hue-sky)}.av{width:40px;height:40px;border-radius:99px;background:var(--hue-indigo);color:#fff;display:flex;align-items:center;justify-content:center;font:var(--fw-bold) 15px/1 var(--font-display);box-shadow:0 0 0 2px var(--bg-app),0 0 0 4px var(--hue-sky)}.soft{padding:10px 12px;border-radius:var(--r-md);background:var(--hue-sky-soft);color:#1F4D82;font:var(--type-footnote)}</style></head><body><div class="g"><span class="chip">Work</span><div class="tile"><span></span></div><div class="day">16<span class="dot"></span></div><div class="av">TS</div><div class="soft">Shared with Work · 4 people</div></div></body></html>
