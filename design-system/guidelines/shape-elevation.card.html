<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);font:var(--type-body)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:16;padding:8px 4px 16px}.b{background:var(--bg-surface);border-radius:var(--r-card);padding:14px;height:78px}.k{font:var(--type-caption);color:var(--text-muted);margin-top:6px}.v{font:var(--type-subhead);font-weight:700;color:var(--text-strong)}</style></head><body><div class="g"><div class="b" style="box-shadow:var(--ring-inset)"><div class="v">0</div><div class="k">Hairline only</div></div><div class="b" style="box-shadow:var(--shadow-1),var(--ring-inset)"><div class="v">1</div><div class="k">List card</div></div><div class="b" style="box-shadow:var(--shadow-2)"><div class="v">2</div><div class="k">Lifted / selected</div></div><div class="b" style="box-shadow:var(--shadow-3)"><div class="v">3</div><div class="k">Sheet, toast</div></div></div></body></html>
