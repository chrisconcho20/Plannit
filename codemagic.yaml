# Codemagic CI/CD — build Plannit in the cloud and ship to TestFlight (no Mac needed).
# One-time setup lives in ios/CODEMAGIC.md. Rename the integration below to match
# the App Store Connect API key you add in the Codemagic UI.

workflows:
  ios-testflight:
    name: Plannit iOS — TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CodemagicAppStoreKey   # <- name of the API key you add in Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.chrisconcho.plannit
      xcode: latest
      # Secure variables SUPABASE_URL, SUPABASE_ANON_KEY and SENTRY_DSN, set in
      # the Codemagic UI (ios/CODEMAGIC.md). Never in this file.
      groups:
        - plannit_release
      vars:
        XCODE_PROJECT: "Plannit.xcodeproj"
        XCODE_SCHEME: "Plannit"
        BUNDLE_ID: "com.chrisconcho.plannit"
    scripts:
      - name: Install XcodeGen and generate the project
        script: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Inject backend and crash-reporting config (build time only)
        script: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY missing from the plannit_release group."
            echo "A TestFlight build without them opens in demo mode."
            exit 1
          fi
          PLIST=ios/Plannit/App/Info.plist
          plutil -replace SUPABASE_URL -string "$SUPABASE_URL" "$PLIST"
          plutil -replace SUPABASE_ANON_KEY -string "$SUPABASE_ANON_KEY" "$PLIST"
          plutil -replace SENTRY_DSN -string "${SENTRY_DSN:-}" "$PLIST"
          [ -n "$SENTRY_DSN" ] && echo "Crash reporting on." || echo "SENTRY_DSN not set: crash reporting off."
      - name: Apply signing profiles
        script: |
          cd ios
          xcode-project use-profiles
      # Build numbers must rise and must never repeat: Apple rejects a repeat
      # with "an attribute with a value that has already been used", after the
      # whole build has run. The lookup used to be silenced and fall back to 0,
      # which numbered every build 1. It now speaks up, and the fallback is a
      # UTC timestamp — always larger than anything that came before it.
      - name: Set the TestFlight build number
        script: |
          cd ios
          LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID") || LATEST=""
          if [ -n "$LATEST" ] && [ "$LATEST" -gt 0 ] 2>/dev/null; then
            NEXT=$((LATEST + 1))
          else
            NEXT=$(date -u +%Y%m%d%H%M)
            echo "Couldn't read the latest TestFlight build number; using $NEXT."
          fi
          echo "Build number: $NEXT"
          agvtool new-version -all "$NEXT"
      - name: Build the IPA
        script: |
          cd ios
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
      # Without debug symbols a crash report is a list of addresses. Skipped
      # when the Sentry variables are absent, so the build still works for
      # anyone who hasn't set crash reporting up.
      - name: Upload debug symbols to Sentry
        script: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "Sentry variables not set: skipping the dSYM upload."
            exit 0
          fi
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli debug-files upload --include-sources ios/build/ios/xcarchive
    artifacts:
      - ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Internal testers get the build automatically once it finishes processing.
