name: iOS Build

# Compiles the SwiftUI app on a macOS runner so the code is validated without a
# local Mac. Builds for the simulator (no signing needed).
on:
  push:
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["ios/**"]
  workflow_dispatch:

# macOS runners bill at 10x the minutes of Linux, so a superseded run is
# expensive dead weight: push twice in a minute and the first one is cancelled.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15   # Sequoia image ships Xcode 16 (reads the project format XcodeGen emits)
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_1*.app | sort -V | tail -1)"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # Tests need a concrete simulator, and the runner's device list changes
      # with the image — pick whatever iPhone it actually has.
      - name: Pick a simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available \
                 | grep -oE 'iPhone [0-9]+[A-Za-z ]*' | tail -1 | xargs)
          echo "Using $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # One invocation, not two. This used to run `xcodebuild build` and then
      # `xcodebuild test`, compiling everything twice — 135s + 252s on a runner
      # billed at 10x. `test` builds what `build` did.
      - name: Build and test
        working-directory: ios
        run: |
          xcodebuild test \
            -project Plannit.xcodeproj \
            -scheme Plannit \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO
