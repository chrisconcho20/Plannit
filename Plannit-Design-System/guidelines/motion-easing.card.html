<!-- @dsCard group="Shape & Depth" viewport="700x170" name="Motion" subtitle="ease-ios for movement, ease-pop only for confirmations. 140/220/340/420ms." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);font:var(--type-body)}.g{display:grid;grid-template-columns:1fr 1fr;gap:12}.b{background:var(--bg-surface);border-radius:var(--r-md);padding:12px;box-shadow:var(--shadow-1)}.track{position:relative;height:26px;background:var(--bg-sunk);border-radius:var(--r-pill);overflow:hidden;margin:8px 0}.dot{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:var(--r-pill);background:var(--coral-500)}.k{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}.n{font:var(--type-subhead);font-weight:600;color:var(--text-strong)}@keyframes slide{0%{left:3px}100%{left:calc(100% - 23px)}}</style></head><body><div class="g"><div class="b"><div class="n">--ease-ios</div><div class="track"><div class="dot" style="animation:slide 420ms cubic-bezier(.32,.72,0,1) infinite alternate"></div></div><div class="k">Sheets, pushes, the segmented thumb</div></div><div class="b"><div class="n">--ease-out</div><div class="track"><div class="dot" style="animation:slide 140ms cubic-bezier(.2,.8,.2,1) infinite alternate"></div></div><div class="k">Taps, hovers, colour changes</div></div><div class="b"><div class="n">--ease-pop</div><div class="track"><div class="dot" style="animation:slide 220ms cubic-bezier(.34,1.4,.64,1) infinite alternate"></div></div><div class="k">A found date, a saved event — sparingly</div></div><div class="b"><div class="n">--dur-slow</div><div class="track"><div class="dot" style="animation:slide 340ms cubic-bezier(.4,0,.2,1) infinite alternate"></div></div><div class="k">Cross-fades between views</div></div></div></body></html>
