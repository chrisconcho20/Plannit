<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);font:var(--type-body)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12}.b{background:var(--bg-surface);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow-1)}.f{height:44px;border-radius:var(--r-control);display:flex;align-items:center;padding:0 12px;font:var(--type-subhead);color:var(--text-muted)}.k{font:var(--type-caption);color:var(--text-faint);margin-top:8px;font-family:var(--font-mono)}</style></head><body><div class="g"><div class="b"><div class="f" style="box-shadow:inset 0 0 0 1px var(--line-strong)">Resting field</div><div class="k">inset 0 0 0 1px --line-strong</div></div><div class="b"><div class="f" style="box-shadow:inset 0 0 0 1.5px var(--line-focus),var(--ring-focus);color:var(--text-strong)">Focused field</div><div class="k">--ring-focus</div></div><div class="b"><div class="f" style="background:var(--action-primary);color:#fff;justify-content:center;transform:scale(.97);box-shadow:none">Pressed button</div><div class="k">scale(--press-scale)</div></div></div></body></html>
