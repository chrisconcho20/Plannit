# XcodeGen spec — run `xcodegen generate` in this folder to produce Plannit.xcodeproj.
# (Or create a new iOS App in Xcode and drag the Plannit/ folder in.)
name: Plannit
options:
  bundleIdPrefix: com.plannit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: "apple-generic"   # lets agvtool bump the build number in CI
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""   # Codemagic manages signing; leave empty

# The one third-party dependency (decision D-16). Only the Realtime product:
# our REST/auth layer stays hand-rolled. Pinned exactly rather than a range —
# the SDK needs Xcode 16.4/Swift 6.1 and the CI runner is on exactly 16.4, so a
# minor bump could break the build without us touching anything.
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.1

targets:
  Plannit:
    type: application
    platform: iOS
    sources:
      - path: Plannit
    dependencies:
      - package: Supabase
        product: Realtime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plannit.app
        INFOPLIST_FILE: Plannit/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Plannit/App/Plannit.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        TARGETED_DEVICE_FAMILY: "1"   # iPhone
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
    scheme:
      testTargets:
        - PlannitTests

  # Unit tests for the pure logic — constraint building, slot/date mapping and
  # the model rules. `xcodebuild test` runs these in CI (see ios-build.yml).
  PlannitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlannitTests
    dependencies:
      - target: Plannit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plannit.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
